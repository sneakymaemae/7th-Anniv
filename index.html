<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 7 Years</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ede2;--paper:#fffdf8;--brown:#5a3e2b;--soft:#8a6a4f;--kraft:#d6bd9b;--line:#5a3e2b26;
  --head:'Special Elite','Courier New',monospace;--hand:'Patrick Hand','Comic Sans MS',cursive}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(#5a3e2b14 1px,transparent 1.5px) 0 0/20px 20px,var(--bg);color:var(--brown);font:400 1.25rem/1.55 var(--hand);overflow-x:hidden;min-height:100svh}
h1,h2,h3{font-family:var(--head);font-weight:400;line-height:1.15}
button{font:400 1rem var(--head);cursor:pointer;border:1px solid var(--brown);border-radius:2px;padding:.7rem 1.5rem;background:var(--paper);color:var(--brown);box-shadow:3px 3px 0 var(--line)}
button:hover{background:#efe2cf}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button.red{background:var(--brown);color:var(--bg)}
button.red:hover{background:#7a5640}
:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding:0 1.4rem;position:relative;z-index:1}
.ph{background:linear-gradient(135deg,#e9dac2,var(--kraft));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(-3deg);z-index:2;background:#d6bd9bcc;box-shadow:0 1px 2px #0002}

/* gate + intro */
#gate,.intro{min-height:100svh;display:grid;place-items:center;text-align:center;padding:1.5rem;position:relative;z-index:1}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);transition:opacity 1s,visibility 1s}
#gate.open{opacity:0;visibility:hidden}
.card{background:var(--paper);color:var(--brown);padding:2.2rem 1.6rem;border:1px solid var(--line);box-shadow:4px 5px 0 var(--line);max-width:420px;width:100%;transform:rotate(-1deg);outline:1px dashed var(--soft);outline-offset:-9px}
.card h1{font-size:clamp(1.8rem,7vw,2.4rem);margin-bottom:.5rem}
.card p{margin-bottom:1.1rem}
#pw{font:inherit;text-align:center;padding:.7rem 1rem;border:1px dashed var(--brown);border-radius:2px;background:var(--bg);color:var(--brown);width:min(15rem,100%);display:block;margin:0 auto .9rem;letter-spacing:.15em}
#err{min-height:1.6rem;color:var(--soft);margin-top:.7rem}
.intro .big{font:400 clamp(4.5rem,24vw,8rem)/1 var(--head)}
body:not(.unlocked) .intro,body.started .intro{display:none}
#story{display:none}
body.started #story{display:block}

/* pages */
.page{display:none}
.page.active{display:block}
.pg{padding:1.6rem 0 5rem;min-height:100svh}
.back{display:inline-block;margin-bottom:1.6rem;padding:.4rem .9rem;font-size:.9rem;background:transparent;box-shadow:none;border:1px dashed var(--soft);color:var(--soft)}
.back:hover{background:var(--paper);color:var(--brown)}
.pg-head{margin-bottom:2rem}
.pg-head h2{display:inline-block;background:var(--kraft);font-size:clamp(1.5rem,5.5vw,2.3rem);padding:.35rem 1.1rem;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--line)}
.pg-head p{margin-top:.9rem;color:var(--soft)}
.pg-head::after{content:"";display:block;margin-top:1.1rem;border-top:1px dashed var(--soft)}

/* menu */
.menu{display:grid;gap:1.1rem}
.mbtn{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;font:400 1.3rem var(--head);padding:1.1rem 1.3rem;transform:rotate(var(--r,0deg))}
.mbtn:nth-child(odd){--r:-.8deg}.mbtn:nth-child(even){--r:.8deg}
.mbtn span{font-size:1rem;color:var(--soft)}

/* polaroids */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2rem 1.3rem}
.pola{background:var(--paper);color:var(--brown);padding:.6rem .6rem 1rem;border:1px solid var(--line);border-radius:1px;box-shadow:3px 4px 0 var(--line);transform:rotate(var(--r,0deg));text-align:center;font:400 1.15rem/1.25 var(--hand);width:100%}
.pola:hover{background:#fff}
.pola:nth-child(3n+1){--r:-2deg}.pola:nth-child(3n+2){--r:1.6deg}.pola:nth-child(3n){--r:-.8deg}
.pola .ph{aspect-ratio:4/5;margin-bottom:.6rem}
.pola small{display:block;font:400 .8rem var(--head);color:var(--soft);margin-top:.2rem}

/* loves */
.paper{background:var(--paper) repeating-linear-gradient(transparent 0 2.6rem,var(--line) 2.6rem calc(2.6rem + 1px));color:var(--brown);border:1px solid var(--line);padding:1.4rem 1.4rem .8rem 3.4rem;box-shadow:4px 5px 0 var(--line);position:relative}
.paper::after{content:"";position:absolute;left:.6rem;top:1.4rem;bottom:1.4rem;width:16px;background:radial-gradient(circle,var(--bg) 0 5px,var(--line) 5px 6px,transparent 7px) 0 0/16px 5.2rem}
ol.loves{list-style:none;padding:0;counter-reset:l;position:relative}
ol.loves::before{content:"";position:absolute;left:-1.3rem;top:-1.4rem;bottom:-.8rem;width:1px;background:var(--soft)}
ol.loves li{counter-increment:l;display:flex;gap:.9rem;align-items:baseline;padding:.3rem 0;min-height:2.6rem;font-size:1.4rem;line-height:1.3}
ol.loves li::before{content:counter(l);flex:none;width:2rem;height:2rem;border:1px solid var(--brown);border-radius:50%;font:400 .95rem/1.9rem var(--head);text-align:center}

@keyframes spin{to{transform:rotate(360deg)}}

/* letter */
.ask{text-align:center;position:relative;z-index:1}
.ask p{font:400 1.4rem var(--head);margin-bottom:1rem}
.env{position:relative;width:min(300px,86%);height:190px;margin:0 auto 1.4rem;background:#ece1cf;border:1px solid var(--line);box-shadow:4px 5px 0 var(--line)}
.env::before{content:"";position:absolute;inset:0;background:#dccdb4;clip-path:polygon(0 100%,50% 45%,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:100px;background:#f6efe2;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s}
.env.open .flap{transform:rotateX(180deg)}
.env .seal{position:absolute;left:50%;top:78px;transform:translateX(-50%);z-index:2;width:34px;height:34px;border-radius:50%;background:var(--brown);color:var(--bg);display:grid;place-items:center;font-size:1.1rem;transition:opacity .3s}
.env.open .seal{opacity:0}
.yn{display:flex;gap:1rem;justify-content:center}
#no.crossed{text-decoration:line-through;opacity:.5;pointer-events:none}
#yes.point{animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.1)}}
#letterBox{display:none;background:var(--paper) repeating-linear-gradient(transparent 0 2.25rem,var(--line) 2.25rem 2.3rem) 0 1.2rem;color:var(--brown);border:1px solid var(--line);padding:1.6rem 1.5rem;box-shadow:4px 5px 0 var(--line);white-space:pre-wrap;font:400 1.35rem/1.7 var(--hand);position:relative;z-index:1}
#letterBox.show{display:block}
#letterBox b{display:block;font:400 1.5rem var(--head);margin-bottom:.6rem}

#music{position:fixed;right:1rem;bottom:1rem;z-index:30;padding:.45rem .9rem;font-size:.8rem;display:none}
dialog{border:1px solid var(--line);padding:0;max-width:min(440px,92vw);width:100%;background:var(--paper);color:var(--brown);margin:auto;overflow:hidden;box-shadow:5px 6px 0 #0004}
dialog::backdrop{background:#2a1c12cc}
dialog .ph{aspect-ratio:4/3}
dialog .body{padding:1.2rem 1.5rem 1.5rem}
dialog h3{font-size:1.5rem;margin-bottom:.3rem}
dialog button{margin-top:1rem;background:var(--brown);color:var(--bg)}

@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.page.active .wrap{animation:rise .5s both}
.page.active .grid>*,.page.active .loves>li,.page.active .songs>*,.page.active .menu>*{animation:rise .5s both;animation-delay:calc(var(--n,0)*80ms)}
.bp{position:fixed;left:50%;top:50%;font-size:1.4rem;color:var(--soft);z-index:60;pointer-events:none;animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== edge designs (iba-iba kada page) ===== */
:root{--dk:#4a3324;--bw:clamp(14px,3.6vw,30px)}
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:var(--bw);z-index:0;pointer-events:none}
body::before{left:0}body::after{right:0}
#deco i{position:fixed;z-index:0;pointer-events:none;display:block}
/* cover: gingham-style checks */
body[data-pg=cover]::before,body[data-pg=cover]::after{background:conic-gradient(var(--kraft) 25%,var(--bg) 0 50%,var(--kraft) 0 75%,var(--bg) 0) 0 0/14px 14px;opacity:.75}
body[data-pg=cover] #deco .c1{top:1.4rem;left:calc(var(--bw) + .4rem);width:90px;height:22px;background:#d6bd9bcc;transform:rotate(-38deg);box-shadow:0 1px 2px #0002}
body[data-pg=cover] #deco .c2{bottom:1.6rem;right:calc(var(--bw) + .4rem);width:90px;height:22px;background:#d6bd9bcc;transform:rotate(-38deg);box-shadow:0 1px 2px #0002}
/* menu: scalloped kraft edges + dotted bg */
body[data-pg=menu]::before{background:radial-gradient(circle at 100% 14px,transparent 8px,var(--kraft) 9px) 0 0/100% 28px}
body[data-pg=menu]::after{background:radial-gradient(circle at 0 14px,transparent 8px,var(--kraft) 9px) 0 0/100% 28px}
body[data-pg=menu] #deco .c1{top:0;right:calc(var(--bw) + 1rem);width:46px;height:46px;background:var(--kraft);clip-path:polygon(0 0,100% 0,100% 100%)}
body[data-pg=menu] #deco .c2{bottom:1.2rem;left:calc(var(--bw) + .6rem);width:70px;height:70px;border:1px dashed var(--soft);border-radius:50%;opacity:.6}
/* photos: film sprockets + graph paper bg */
body[data-pg=photos]{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/26px 26px,var(--bg)}
body[data-pg=photos]::before,body[data-pg=photos]::after{background:repeating-linear-gradient(180deg,var(--dk) 0 8px,transparent 8px 22px) center/100% 100%,linear-gradient(var(--bg),var(--bg)) center/9px 100% no-repeat,var(--dk)}
body[data-pg=photos] #deco .c1,body[data-pg=photos] #deco .c2{width:38px;height:38px;background:var(--dk)}
body[data-pg=photos] #deco .c1{top:0;left:var(--bw);clip-path:polygon(0 0,100% 0,0 100%)}
body[data-pg=photos] #deco .c2{bottom:0;right:var(--bw);clip-path:polygon(100% 0,100% 100%,0 100%)}
/* loves: ruled bg + stitched edges */
body[data-pg=loves]{background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px),var(--bg)}
body[data-pg=loves]::before,body[data-pg=loves]::after{background:repeating-linear-gradient(180deg,var(--soft) 0 9px,transparent 9px 17px) 50%/2px 100% no-repeat,linear-gradient(90deg,#d6bd9b66,#d6bd9b66)}
body[data-pg=loves] #deco .c1{top:1.2rem;right:calc(var(--bw) + .5rem);width:80px;height:20px;background:#8a6a4f88;transform:rotate(6deg);box-shadow:0 1px 2px #0002}
body[data-pg=loves] #deco .c2{bottom:1.4rem;left:calc(var(--bw) + .5rem);width:80px;height:20px;background:#d6bd9bcc;transform:rotate(-5deg);box-shadow:0 1px 2px #0002}
/* letter: airmail stripes + kraft bg + stamp */
body[data-pg=letter]{background:radial-gradient(#5a3e2b18 1px,transparent 1.5px) 0 0/18px 18px,#ede0cb}
body[data-pg=letter]::before,body[data-pg=letter]::after{background:repeating-linear-gradient(135deg,var(--brown) 0 10px,var(--paper) 10px 20px,var(--kraft) 20px 30px,var(--paper) 30px 40px);opacity:.85}
body[data-pg=letter] #deco .c1{top:1rem;right:calc(var(--bw) + .6rem);width:54px;height:66px;background:var(--paper);border:2px dashed var(--soft);outline:5px solid var(--paper);transform:rotate(5deg);box-shadow:2px 3px 0 var(--line)}
body[data-pg=letter] #deco .c2{bottom:1.4rem;left:calc(var(--bw) + .6rem);width:74px;height:74px;border:2px solid var(--soft);border-radius:50%;opacity:.5;box-shadow:0 0 0 5px #ede0cb,0 0 0 6px var(--soft)}
@media (prefers-reduced-motion:no-preference){body::before,body::after{transition:opacity .4s}}

/* songs: Spotify-style page, same brown palette */
body[data-pg=songs]{background:linear-gradient(180deg,#75533a 0,#3b291d 340px,#1d130c 680px) no-repeat,#1d130c;color:var(--bg)}
body[data-pg=songs]::before,body[data-pg=songs]::after,body[data-pg=songs] #deco i{display:none}
#songs .back{border:0;border-radius:999px;background:#00000059;color:var(--bg);padding:.5rem 1.1rem}
#songs .back:hover{background:#0000008c;color:#fff}
#songs .hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:1.4rem;margin-bottom:1.4rem}
#songs .cover{flex:none;width:clamp(150px,40vw,220px);aspect-ratio:1;display:grid;place-items:center;border-radius:4px;background:linear-gradient(135deg,#e9dac2,var(--kraft));color:var(--brown);font-size:clamp(4rem,14vw,6.5rem);box-shadow:0 10px 40px #0009}
#songs .meta{min-width:0;flex:1 1 240px}
#songs .meta small{font:400 .95rem var(--head);letter-spacing:.06em;color:#e9dac2}
#songs .meta h2{font-size:clamp(2.2rem,9vw,4.2rem);line-height:1.05;margin:.3rem 0 .8rem;overflow-wrap:anywhere}
#songs .by{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;font-size:1.1rem;color:#e9dac2}
#songs .by b{font-weight:400;color:var(--bg)}
#songs .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--kraft);color:var(--brown);font-size:.7rem;font-style:normal}
#songs .bar{display:flex;align-items:center;gap:1.2rem;margin:1.6rem 0 1.2rem}
#songs .play{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;padding-left:4px;background:var(--kraft);color:#2a1c12;font-size:1.4rem;text-decoration:none;box-shadow:0 4px 14px #0006;transition:transform .15s,background .15s}
#songs .play:hover{transform:scale(1.06);background:#e9dac2}
#songs .bar .heart{color:var(--kraft);font-size:1.8rem;line-height:1}
#songs .bar .hint{color:#cbb497;font-size:1.1rem}
#songs .trk-h{display:grid;grid-template-columns:2rem 1fr;gap:1rem;padding:.4rem .8rem;border-bottom:1px solid #ffffff1f;color:#cbb497;font:400 .85rem var(--head);letter-spacing:.06em}
#songs .trk{display:grid;grid-template-columns:2rem 44px 1fr;gap:1rem;align-items:center;margin-top:.4rem;padding:.6rem .8rem;border-radius:6px;color:inherit;text-decoration:none}
#songs .trk:hover{background:#ffffff14}
#songs .trk .mini{width:44px;height:44px;display:grid;place-items:center;background:var(--kraft);color:var(--brown);border-radius:2px}
#songs .trk b{display:block;font:400 1.15rem var(--head);color:var(--bg);overflow-wrap:anywhere}
#songs .trk small{display:block;font:400 1rem var(--hand);color:#cbb497}
#songs .eq{display:flex;align-items:flex-end;gap:2px;height:14px}
#songs .eq i{width:3px;height:8px;background:var(--kraft);animation:eq 1s ease-in-out infinite}
#songs .eq i:nth-child(2){animation-delay:.25s}
#songs .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
#songs .lyr{margin-top:1.8rem;padding:1.4rem 1.4rem 1.7rem;border-radius:12px;background:var(--kraft);color:#2a1c12;box-shadow:0 8px 30px #0006}
#songs .lyr small{font:400 .85rem var(--head);letter-spacing:.06em;opacity:.7}
#songs .lyr p{margin-top:.6rem;font:400 clamp(1.5rem,5.5vw,2rem)/1.35 var(--hand)}
</style>
</head>
<body data-pg="cover">
<div id="deco" aria-hidden="true"><i class="c1"></i><i class="c2"></i></div>

<div id="gate">
  <div class="card">
    <h1>For you</h1>
    <p>Enter the date our story began.</p>
    <input id="pw" type="text" inputmode="numeric" autocomplete="off" aria-label="Passcode" placeholder="MM-DD-YY">
    <button class="red" id="enter">Unlock</button>
    <div id="err" role="alert"></div>
  </div>
</div>

<audio id="bgm" loop preload="none"></audio>
<button id="music" aria-label="Play or pause music">Play music</button>

<section class="intro" id="top">
  <div class="card tape">
    <div class="big" id="daysNum">0</div>
    <p>days together, and counting</p>
    <h1>Happy 7 years, love!</h1>
    <button class="red" id="start">Open</button>
  </div>
</section>


<div id="story">
  <section class="pg page" id="menu"><div class="wrap">
    <div class="pg-head"><h2>Happy 7 years!</h2><p>Choose what you'd like to see…</p></div>
    <div class="menu" id="menuList"></div>
  </div></section>

  <section class="pg page" id="photos"><div class="wrap">
    <div class="pg-head"><h2>7 pictures</h2><p>Tap a photo to read the story behind it.</p></div>
    <div class="grid" id="memories"></div>
  </div></section>

  <section class="pg page" id="loves"><div class="wrap">
    <div class="pg-head"><h2>7 things I love about you</h2></div>
    <div class="paper tape"><ol class="loves" id="lovesList"></ol></div>
  </div></section>

  <section class="pg page" id="songs"><div class="wrap">
    <div class="songs" id="songList"></div>
  </div></section>

  <section class="pg page" id="letter"><div class="wrap">
    <div class="ask" id="ask">
      <p id="askText">You have received a letter!<br>open it?</p>
      <div class="env" id="env"><span class="flap"></span><span class="seal">♡</span></div>
      <div class="yn"><button id="no">NO</button><button class="red" id="yes">YES</button></div>
    </div>
    <div id="letterBox" class="tape"></div>
  </div></section>
</div>

<dialog id="dlg">
  <div class="ph" id="dImg"></div>
  <div class="body"><h3 id="dTitle"></h3><p id="dText"></p><button id="dClose">Close</button></div>
</dialog>

<script>
/* ============ I-EDIT MO LANG ITO ============ */
const C = {
  start: "2019-09-30",            // simula ng relasyon (YYYY-MM-DD)
  password: "093019",             // MMDDYY (numbers lang; tinatanggap din ang 09302019)
  music: "music.mp3",             // ilagay sa parehong folder, o "" kung wala

  // 7 pictures: photos/m1.jpg ... photos/m7.jpg

    { img: "photos/m4.jpg", title: "Our 4th Anniversary", text: "My First Successful na surprise HAHAHA kala mo pa walang magiging ganap dyan kase may event kaya that time." },
    { img: "photos/m5.jpg", title: "Sorsogon City", text: "Ako naman shempre yung nag support kase i want to see you perform live, yun nga lang di man sana nakahiling ta super daming tao and that is another milestone of your life and i want to be part of it." },
    { img: "photos/m6.jpg", title: "Bini Concert", text: "AHHHHH!!! First time na nag - gala kita ning kitang duwa lang and we got to see BINI perform liveee!" },
    { img: "photos/m7.jpg", title: "Our Little Paw-mily", text: "Bagi man sana kita na nagka baby talaga, sya din salo pa sa rason kung ngata mas lalong nagtibay relasyon ta." }
  ],

  // 7 things I love about you
  loves: [
    "I love how you always make my mood lighter whenever I’m having a bad day.",
    "I love how you do silly little things just to make our days more fun and make me smile.",
    "I love how you spoil me way too much, even in the simplest ways.",
    "I love how you handle your problems and manage to stay strong through everything.",
    "I love how confident and strong you are. I admire the way you carry yourself and believe in yourself.",
    "I love your imperfections and flaws. They’re part of what makes you, you, and I wouldn’t want you any other way.",
    "I love everything about you—even the little things that sometimes drive me crazy. 🤎"
  ],

  // ang nag-iisang kanta natin
  song: {
    title: "Song Palagi",          // ilagay ang title ng kanta
    label: "TJ Monterde",         // ilagay ang artist
    url: "https://www.youtube.com/watch?v=v82VtUUGFqk",
    why: "No matter how many fights we go through, no matter how hard things get, I will always choose you. Ikaw, at ikaw palagi. 🤎"
  },

  // ang letter (\n = bagong linya)
  letterTitle: "Happy Anniversary, Babi!",
  letter: "Hays, 7 years na kitang ga tyaga sa kada salo AHAHAHA di na ako matalam na ika lang gapasensya sako ta alam mo man na pati ako gapa sensya din saimo HAHAHAHA kidding aside, sana mas mag awat pa kita lalo, maski inanong iwal, irita ang namamati ta sa kada salo. And I hope na mas maging strong pa ang relayon ta kesa sa mga naka agi. And sana masundan na yung last na travel ta. Mahal na mahal kita babi, maski kakinusog pa ning hagong mo.\n\nHappy 7 years to us!.\n\n- Kulot"
};
/* ============================================ */

const $ = id => document.getElementById(id);
const ph = (src, alt = "") => `<div class="ph">${src ? `<img src="${src}" alt="${alt}" loading="lazy" onerror="this.remove()">` : ""}</div>`;

/* gate */
function tryOpen(){
  const v = $("pw").value.replace(/\D/g, "");
  const pw = C.password.replace(/\D/g, "");
  const ok = [pw, ...(pw.length === 6 ? [pw.slice(0,4) + "20" + pw.slice(4)] : [])];
  if (ok.includes(v)) {
    $("gate").classList.add("open");
    document.body.classList.add("unlocked");
    $("err").textContent = "";
    setupMusic(true); burst(20);
  } else { $("err").textContent = "That's not it. Try again"; $("pw").select(); }
}
$("enter").onclick = tryOpen;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryOpen(); });
$("daysNum").textContent = Math.max(0, Math.floor((new Date() - new Date(C.start + "T00:00:00")) / 864e5)).toLocaleString();

/* content */
$("memories").innerHTML = C.memories.map((m, i) =>
  `<button class="pola tape" data-m="${i}">${ph(m.img, m.title)}Photo #${i + 1}<small>${m.title}</small></button>`).join("");
$("memories").onclick = e => { const b = e.target.closest("[data-m]"); if (b) openDlg(C.memories[b.dataset.m]); };
$("lovesList").innerHTML = C.loves.map(l => `<li>${l}</li>`).join("");
$("songList").innerHTML = `<div class="hero"><div class="cover">♪</div><div class="meta"><small>Our song</small><h2>${C.song.title}</h2><p class="by"><i class="av">♥</i><b>${C.song.label}</div></div>
  <div class="bar"><a class="play" href="${C.song.url}" target="_blank" rel="noopener" aria-label="Play on YouTube">▶</a><span class="heart">♥</span><span class="hint">Play on YouTube</span></div>
  <div><div class="trk-h"><span>#</span><span>TITLE</span></div>
  <a class="trk" href="${C.song.url}" target="_blank" rel="noopener"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="mini">♪</span><span><b>${C.song.title}</b><small>${C.song.label}</small></span></a></div>
  <div class="lyr"><small>WHY THIS SONG</small><p>${C.song.why}</p></div>`;

/* letter: NO / YES */
$("letterBox").innerHTML = `<b></b><span></span>`;
$("letterBox").firstChild.textContent = C.letterTitle;
$("letterBox").lastChild.textContent = C.letter;
$("no").onclick = () => {
  $("askText").innerHTML = "Aww... the letter was hoping<br>you'd open it";
  $("no").classList.add("crossed"); $("yes").classList.add("point");
};
$("yes").onclick = () => {
  $("env").classList.add("open");
  $("yes").disabled = true; burst(30);
  setTimeout(() => { $("ask").style.display = "none"; $("letterBox").classList.add("show"); }, 800);
};

/* dialog */
function openDlg(o){
  $("dImg").innerHTML = o.img ? `<img src="${o.img}" alt="" onerror="this.remove()">` : "";
  $("dTitle").textContent = o.title; $("dText").textContent = o.text;
  $("dlg").showModal();
}
$("dClose").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

/* pages + buttons */
const secs = [["photos","7 pictures","01"],["loves","7 things I love","02"],["songs","Our song","03"],["letter","Letter","04"]];
const pages = ["menu", ...secs.map(s => s[0])];
$("menuList").innerHTML = secs.map(([id, t, e]) => `<button class="mbtn tape" data-go="${id}"><span>${e}</span>${t}</button>`).join("");
/* back button on every page */
pages.forEach(id => $(id).querySelector(".wrap").insertAdjacentHTML("afterbegin",
  `<button class="back" data-go="${id === "menu" ? "cover" : "menu"}">← Back</button>`));
document.querySelectorAll(".grid>*,ol.loves>li,.songs>*,.menu>*").forEach(el => el.style.setProperty("--n", [...el.parentNode.children].indexOf(el)));

/* confetti burst */
function burst(n = 26){
  for (let i = 0; i < n; i++) {
    const b = document.createElement("span"), a = Math.random() * 6.28, d = 100 + Math.random() * Math.min(innerWidth, 520) / 1.7;
    b.className = "bp"; b.textContent = ["♡","✦","·","♥","✧"][i % 5];
    b.style.cssText = `--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;--rot:${Math.random() * 360}deg`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 1700);
  }
}

function go(id){
  document.body.dataset.pg = id;
  if (id === "cover") { document.body.classList.remove("started"); window.scrollTo(0, 0); return; }
  pages.forEach(p => $(p).classList.toggle("active", p === id));
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
$("start").onclick = () => { document.body.classList.add("started"); go("menu"); burst(30); };

/* music */
const bgm = $("bgm"), mbtn = $("music");
function setupMusic(tryPlay){
  if (!C.music) return;
  if (!bgm.getAttribute("src")) bgm.src = C.music;
  mbtn.style.display = "block";
  if (tryPlay) bgm.play().then(() => mbtn.textContent = "Pause music").catch(() => {});
}
mbtn.onclick = () => bgm.paused ? bgm.play().then(() => mbtn.textContent = "Pause music").catch(() => {}) : (bgm.pause(), mbtn.textContent = "Play music");
bgm.addEventListener("error", () => { mbtn.style.display = "none"; });
</script>
</body>
</html>
